<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeMasteryAI - Loading...</title>
    <script>
      // Handle GitHub Pages SPA routing
      // This 404.html redirects to index.html while preserving the requested path
      (function() {
        // Get the redirect path from query string (set by the redirect logic below)
        const redirect = sessionStorage.getItem('redirect');
        
        // If we have a stored redirect, use it and clear it
        if (redirect) {
          sessionStorage.removeItem('redirect');
          window.location.replace(redirect);
        } else {
          // Store current location for redirect after index.html loads
          // This preserves the path for the SPA router
          const pathname = window.location.pathname;
          const search = window.location.search;
          const hash = window.location.hash;
          
          // Store the intended path
          sessionStorage.setItem('redirect', pathname + search + hash);
          
          // Redirect to index.html
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    <p>Loading TradeMasteryAI...</p>
  </body>
</html>
