<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeMasteryAI | Free AI-Powered Forex Trading Tools & Education</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: #fff;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
      }
      #error {
        display: none;
        background: #fee;
        color: #c33;
        padding: 20px;
        border: 1px solid #fcc;
        border-radius: 4px;
        max-width: 600px;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .loading {
        text-align: center;
        color: #666;
      }
    </style>
    <script>
      // Show errors instead of blank screen
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        showError('JavaScript Error:\n' + msg + '\nURL: ' + url + '\nLine: ' + lineNo);
        return false;
      };
      
      window.addEventListener('unhandledrejection', event => {
        showError('Unhandled Promise Rejection:\n' + event.reason);
      });
      
      function showError(message) {
        const errorEl = document.getElementById('error');
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'block';
          console.error(message);
        }
      }
      
      // Log when script starts loading
      console.log('Initializing TradeMasteryAI...');
      console.log('Current path:', window.location.pathname);
      console.log('Current href:', window.location.href);
    </script>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <h2>Loading TradeMasteryAI...</h2>
        <p>If this message persists, check browser console for errors.</p>
      </div>
    </div>
    <div id="error"></div>
    <script type="module">
      console.log('Starting module...');
      
      // Detect base path from current URL
      const basePath = window.location.pathname.split('/').slice(0, -1).join('/') || '/';
      const entryClientPath = basePath.endsWith('/') ? basePath + 'assets/entry-client.js' : basePath + '/assets/entry-client.js';
      
      console.log('Base path:', basePath);
      console.log('Entry client path:', entryClientPath);
      console.log('Full URL:', window.location.origin + entryClientPath);
      
      try {
        import(entryClientPath).then(() => {
          console.log('Entry client loaded successfully');
        }).catch(err => {
          console.error('Failed to load entry client:', err);
          document.getElementById('error').textContent = 'Failed to load entry-client.js:\n' + err.message + '\n\nCheck console for details.';
          document.getElementById('error').style.display = 'block';
        });
      } catch (err) {
        console.error('Error loading module:', err);
        document.getElementById('error').textContent = 'Error: ' + err.message;
        document.getElementById('error').style.display = 'block';
      }
    </script>
  </body>
</html>
